substitutions:
  project_name: kbxRGBBinaryClock
  project_version: v1

external_components:
  - source:
      # type: git
      # url: https://github.com/kbx81/esphome_external_components
      type: local
      path: ../esphome_external_components/components
    components:
      - rgb_binary_clock
    refresh: always

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf
    # version: 5.4.2
    # platform_version: 54.03.21
    advanced:
      signed_ota_verification:
        signing_key: shared/kbx_signing_key_rsa3072.pem
        signing_scheme: rsa3072

wifi:
  enable_btm: true
  enable_rrm: true

api:
  actions:
    - action: play_rtttl
      variables:
        rtttl_song: string
      then:
        - logger.log:
            format: "song: %s"
            args: ["rtttl_song.c_str()"]
        - rgb_binary_clock.play_rtttl:
            id: kbx_rgb_binary_clock
            rtttl: !lambda 'return rtttl_song;'

web_server:
  port: 80
  version: 3

uart:
  - id: uart_rgb_binary_clock
    tx_pin: 1
    rx_pin: 0
    baud_rate: 230400

globals:
  - id: clock_time_synced
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 47h
    then:
      - if:
          condition:
            lambda: 'return id(esptime).now().is_valid();'
          then:
            - button.press: clock_update_time_btn

time:
  - platform: homeassistant
    id: esptime
    timezone: CST+6CDT,M3.2.0/2,M11.1.0/2
    on_time_sync:
      then:
        - if:
            condition:
              lambda: 'return !id(clock_time_synced);'
            then:
              - lambda: 'id(clock_time_synced) = true;'
              - button.press: clock_update_time_btn

rgb_binary_clock:
  - id: kbx_rgb_binary_clock
    uart_id: uart_rgb_binary_clock
    boot_0_pin: 3
    reset_pin: 5
    # on_message:
    #   - logger.log:
    #       format: "Received message: %s"
    #       args: ["message.c_str()"]

