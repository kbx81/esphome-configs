button:
  - platform: template
    id: clear_alarm_btn
    name: Clear Alarm
    icon: mdi:alarm-check
    on_press:
      - rgb_binary_clock.timer_clear_alarm:

  - platform: template
    id: timer_run_down_btn
    name: Timer Run Down
    icon: mdi:timer-play
    on_press:
      - rgb_binary_clock.timer_run_down:

  - platform: template
    id: timer_run_up_btn
    name: Timer Run Up
    icon: mdi:timer-play
    on_press:
      - rgb_binary_clock.timer_run_up:

  - platform: template
    id: timer_stop_btn
    name: Timer Stop
    icon: mdi:timer-stop
    on_press:
      - rgb_binary_clock.timer_stop:

  - platform: template
    id: timer_reset_btn
    name: Timer Reset
    icon: mdi:timer-refresh
    on_press:
      - rgb_binary_clock.timer_reset:

  - platform: template
    id: play_hourly_chime_btn
    name: Play Hourly Chime
    entity_category: config
    icon: mdi:bell-ring
    on_press:
      - rgb_binary_clock.play_chime:

  - platform: template
    id: save_settings_btn
    name: Save Settings
    entity_category: config
    icon: mdi:content-save
    on_press:
      - rgb_binary_clock.save_settings:

  - platform: template
    id: clock_update_time_btn
    name: Clock Update Time
    entity_category: config
    icon: mdi:timer-sync
    on_press:
      - rgb_binary_clock.set_time:
          time: !lambda 'return id(esptime).now();'

  - platform: template
    id: stop_rtttl_btn
    name: Stop RTTTL
    icon: mdi:stop-circle-outline
    on_press:
      - rgb_binary_clock.stop_rtttl:

  - platform: template
    id: clock_factory_reset_btn
    name: Clock Factory Reset
    entity_category: diagnostic
    icon: mdi:delete-forever
    on_press:
      - rgb_binary_clock.factory_reset:

  - platform: template
    id: clock_reset_btn
    name: Clock Reset
    entity_category: diagnostic
    icon: mdi:power-cycle
    on_press:
      - rgb_binary_clock.reset:

  - platform: template
    id: clock_update_firmware_btn
    name: Clock Update Firmware
    entity_category: diagnostic
    icon: mdi:update
    on_press:
      - rgb_binary_clock.update_firmware:
          url: https://www.kbx81.net/download/public/kbx_rgb_binary_clock/v4/RGBBinaryClock.bin

