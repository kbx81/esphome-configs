sensor:
  - platform: tube_clock
    type: adc_light
    id: light_level_sen
    name: Light Level
    filters:
      - median:
          window_size: 7
          send_every: 4
          send_first_at: 4
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  - platform: tube_clock
    type: adc_vdda
    id: vdda_sen
    name: VddA
    filters:
      - median:
          window_size: 7
          send_every: 4
          send_first_at: 4
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1
      - delta: 0.01

  - platform: tube_clock
    type: adc_vbatt
