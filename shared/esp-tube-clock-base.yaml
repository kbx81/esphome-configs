substitutions:
  project_name: kbxTubeClock
  project_version: v1

external_components:
  - source:
      # type: git
      # url: https://github.com/kbx81/esphome_external_components
      type: local
      path: ../esphome_external_components/components
    components:
      - tube_clock
    refresh: always

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf
    # version: 5.4.2
    # platform_version: 54.03.21
    advanced:
      signed_ota_verification:
        signing_key: shared/kbx_signing_key_rsa3072.pem
        signing_scheme: rsa3072

wifi:
  enable_btm: true
  enable_rrm: true

api:
  actions:
    - action: play_rtttl
      variables:
        rtttl_song: string
      then:
        - logger.log:
            format: "song: %s"
            args: ["rtttl_song.c_str()"]
        - tube_clock.play_rtttl:
            id: kbx_tube_clock
            rtttl: !lambda 'return rtttl_song;'

web_server:
  port: 80
  version: 3

remote_receiver:
  id: ir_rx
  dump: [nec]
  pin:
    inverted: true
    number: 2

uart:
  - id: uart_tube_clock
    baud_rate: 230400
    rx_pin: 7
    tx_pin: 20

tube_clock:
  - id: kbx_tube_clock
    uart_id: uart_tube_clock
    dfu_uart_config:
      tx_pin: 4
      rx_pin: 9
      baud_rate: 460800
      parity: EVEN
    boot_0_pin: 3
    reset_pin:
      number: 5
      allow_other_uses: ${reset_pin_allow_other_uses}
    # on_message:
    #   - logger.log:
    #       format: "Received message: %s"
    #       args: ["message.c_str()"]

