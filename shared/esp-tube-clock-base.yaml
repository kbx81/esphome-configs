    entity_category: config
    icon: mdi:bell-ring
    on_press:
      - tube_clock.play_chime:

  - platform: template
    id: save_settings_btn
    name: Save Settings
    entity_category: config
    icon: mdi:content-save
    on_press:
      - tube_clock.save_settings:

  - platform: template
    id: stop_rtttl_btn
    name: Stop RTTTL
    icon: mdi:stop-circle-outline
    on_press:
      - tube_clock.stop_rtttl:

  - platform: template
    id: clock_factory_reset_btn
    name: Wipe Clock Preferences
    entity_category: diagnostic
    icon: mdi:delete-forever
    on_press:
      - tube_clock.factory_reset:

  - platform: template
    id: clock_reset_btn
    name: Restart Clock
    entity_category: diagnostic
    icon: mdi:power-cycle
    on_press:
      - tube_clock.reset:

  - platform: template
    id: clock_update_firmware_btn
    name: Update Clock Firmware
    entity_category: diagnostic
    icon: mdi:update
    on_press:
      - tube_clock.update_firmware:
          url: https://www.kbx81.net/download/public/kbx_tube_clock/v1/TubeClock.bin

