substitutions:
  node_name: esp-rc-ir-bsmt
  node_friendly_name: Basement IR Controller
  project_name: kbxIRBlaster
  project_version: v4

packages:
  esp_common: !include shared/esp__common_core.yaml

wifi:
  enable_btm: true
  enable_rrm: true

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf
    # version: 5.4.2
    # platform_version: 54.03.21

esphome:
  on_boot:
    priority: 375
    then:
      - globals.set:
          id: boot_complete
          value: "true"

globals:
  # block transmitting anything until after switch states are restored
  - id: boot_complete
    type: bool
    initial_value: "false"
    restore_value: no

status_led:
  pin: 20

remote_receiver:
  - id: ir_rx
    dump:
      - panasonic
      - pioneer
    rmt_symbols: 48
    pin:
      inverted: true
      number: 1

remote_transmitter:
  - id: ir_tx
    pin: 0
    carrier_duty_percent: 50%
    rmt_symbols: 48
  # - pin: 7
  #   id: rf_tx
  #   carrier_duty_percent: 100%

light:
  - platform: esp32_rmt_led_strip
    id: ws2812_leds
    restore_mode: RESTORE_DEFAULT_OFF
    rgb_order: GRB
    rmt_symbols: 48
    pin: 8
    num_leds: 2
    chipset: ws2812
    name: Status

switch:
  - platform: gpio
    id: green_led_mode
    name: Green LED to GPIO 0
    pin: 23
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    id: red_led_mode
    name: Red LED to GPIO 0
    pin: 21
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: panasonic_power
    name: Panasonic Power
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_off_action:
      - remote_transmitter.transmit_panasonic:
          transmitter_id: ir_tx
          address: 0x4004
          command: 0x0100FCFD
    turn_on_action:
      - remote_transmitter.transmit_panasonic:
          transmitter_id: ir_tx
          address: 0x4004
          command: 0x01007C7D
  - platform: template
    id: pioneer_power
    name: Pioneer Power
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_off_action:
      - remote_transmitter.transmit_pioneer:
          transmitter_id: ir_tx
          rc_code_1: 0xA51B
          repeat:
            times: 2
    turn_on_action:
      - remote_transmitter.transmit_pioneer:
          transmitter_id: ir_tx
          rc_code_1: 0xA51A
          repeat:
            times: 2
  - platform: template
    id: infotainment_system
    name: Infotainment System
    lambda: "return id(pioneer_power).state || id(panasonic_power).state;"
    turn_off_action:
      - if:
          condition:
            lambda: "return id(boot_complete);"
          then:
            - switch.turn_off: panasonic_power
            - delay: 250ms
            - switch.turn_off: pioneer_power
    turn_on_action:
      - if:
          condition:
            lambda: "return id(boot_complete);"
          then:
            - switch.turn_on: pioneer_power
            - delay: 250ms
            - switch.turn_on: panasonic_power

