select:
  - platform: template
    id: timer_energy_saver_select
    name: Toto Timer Energy Saver
    entity_category: config
    optimistic: true
    options:
      - "Off"
      - 3 hours
      - 6 hours
      - 9 hours
    initial_option: "Off"
    restore_value: true
    on_value:
      then:
        - lambda:
            static const uint8_t timer_energy_saver_codes[] = {0x00, 0x0C, 0x06, 0x09};
            id(toto_timer_energy_saver) = timer_energy_saver_codes[i];
        - remote_transmitter.transmit_toto:
            transmitter_id: ir_tx
            command: 0x68
            rc_code_1: !lambda "return id(toto_timer_energy_saver);"
            rc_code_2: 0x00
  - platform: template
    id: auto_close_delay_select
