globals:
  - id: toto_dryer_temperature
    type: uint8_t
    initial_value: '0'
  - id: toto_seat_temperature
    type: uint8_t
    initial_value: '0'
  - id: toto_water_temperature
    type: uint8_t
    initial_value: '0'
  - id: toto_water_pressure
    type: uint8_t
    initial_value: '0'
  - id: toto_water_position
    type: uint8_t
    initial_value: '0'
  - id: toto_timer_energy_saver
    type: uint8_t
    initial_value: '0'
  - id: toto_auto_close_delay
    type: uint8_t
    initial_value: '0'
  - id: toto_auto_open_delay
    type: uint8_t
    initial_value: '0'
  - id: toto_auto_open_lid_seat
    type: uint8_t
    initial_value: '0'

script:
  - id: load_user_1_settings
    mode: restart
    then:
    - number.set:
        id: toto_dryer_temperature_number
        value: !lambda "return id(toto_user_1_dryer_temperature_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_seat_temperature_number
        value: !lambda "return id(toto_user_1_seat_temperature_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_water_temperature_number
        value: !lambda "return id(toto_user_1_water_temperature_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_water_position_number
        value: !lambda "return id(toto_user_1_water_position_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_water_pressure_number
        value: !lambda "return id(toto_user_1_water_pressure_number).state;"
  - id: load_user_2_settings
    mode: restart
    then:
    - number.set:
        id: toto_dryer_temperature_number
        value: !lambda "return id(toto_user_2_dryer_temperature_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_seat_temperature_number
        value: !lambda "return id(toto_user_2_seat_temperature_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_water_temperature_number
        value: !lambda "return id(toto_user_2_water_temperature_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_water_position_number
        value: !lambda "return id(toto_user_2_water_position_number).state;"
    - delay: 500ms
    - number.set:
        id: toto_water_pressure_number
        value: !lambda "return id(toto_user_2_water_pressure_number).state;"
  - id: update_dryer_temperature_global
    mode: restart
    then:
      - lambda: |-
          static const uint8_t dryer_temp_codes[] = {0x08, 0x04, 0x0C, 0x02, 0x0A};
          id(toto_dryer_temperature) = static_cast<uint8_t>(id(toto_dryer_temperature_number).state) - 1;
          id(toto_dryer_temperature) = dryer_temp_codes[id(toto_dryer_temperature)];
  - id: update_position_global
    mode: restart
    then:
      - lambda: |-
          static const uint8_t position_codes[] = {0x08, 0x04, 0x0C, 0x02, 0x0A};
          id(toto_water_position) = static_cast<uint8_t>(id(toto_water_position_number).state) - 1;
          id(toto_water_position) = position_codes[id(toto_water_position)];
  - id: update_pressure_global
    mode: restart
    then:
      - lambda: |-
          static const uint8_t pressure_codes[] = {0x04, 0x0C, 0x02, 0x0A, 0x06};
          id(toto_water_pressure) = static_cast<uint8_t>(id(toto_water_pressure_number).state) - 1;
          id(toto_water_pressure) = pressure_codes[id(toto_water_pressure)];
  - id: update_seat_and_water_temperature_globals
    mode: restart
    then:
      - lambda: |-
          static const uint8_t seat_and_water_temp_codes[] = {0x00, 0x08, 0x0A, 0x01, 0x09, 0x0D};
          // Cast number component states to uint8_t
          id(toto_seat_temperature) = static_cast<uint8_t>(id(toto_seat_temperature_number).state);
          id(toto_water_temperature) = static_cast<uint8_t>(id(toto_water_temperature_number).state);
          // Update the globals to the current codes to send based on the number components
          id(toto_seat_temperature) = seat_and_water_temp_codes[id(toto_seat_temperature)];
          id(toto_water_temperature) = seat_and_water_temp_codes[id(toto_water_temperature)];

