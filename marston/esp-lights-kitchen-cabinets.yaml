substitutions:
  node_name: esp-lights-kitchen-cabinets
  node_friendly_name: Kitchen Cabinets
  project_name: kbxLEDController-16ch
  project_version: v3

packages:
  esp_common: !include shared/esp__common_core.yaml

wifi:
  enable_btm: true
  enable_rrm: true

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true
      signed_ota_verification:
        signing_key: shared/kbx_signing_key_rsa3072.pem
        signing_scheme: rsa3072

status_led:
  pin:
    number: 5
    inverted: true

remote_receiver:
  id: ir_rx
  dump: nec
  pin:
    inverted: true
    number: 36

remote_transmitter:
  - pin: 2
    id: rf
    carrier_duty_percent: 100%

binary_sensor:
  - platform: gpio
    id: leds_off_button
    pin:
      number: 0
      inverted: true
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - light.turn_off: kitchen_undercabinet_east
        - light.turn_off: kitchen_undercabinet_sink
        - light.turn_off: kitchen_undercabinet_west
        - light.turn_off: kitchen_undercabinet_refrigerator

light:
  - platform: rgbw
    id: kitchen_undercabinet_east
    name: East
    restore_mode: RESTORE_DEFAULT_OFF
    red: pwm_red_s4
    green: pwm_green_s4
    blue: pwm_blue_s4
    white: pwm_white_s4
    effects:
      - flicker:
      - pulse:
      - random:
          transition_length: 500ms
          update_interval: 1s
      - strobe:
  - platform: rgbw
    id: kitchen_undercabinet_sink
    name: Sink
    restore_mode: RESTORE_DEFAULT_OFF
    red: pwm_red_s3
    green: pwm_green_s3
    blue: pwm_blue_s3
    white: pwm_white_s3
    effects:
      - flicker:
      - pulse:
      - random:
          transition_length: 500ms
          update_interval: 1s
      - strobe:
  - platform: rgbw
    id: kitchen_undercabinet_west
    name: West
    restore_mode: RESTORE_DEFAULT_OFF
    red: pwm_red_s2
    green: pwm_green_s2
    blue: pwm_blue_s2
    white: pwm_white_s2
    effects:
      - flicker:
      - pulse:
      - random:
          transition_length: 500ms
          update_interval: 1s
      - strobe:
  - platform: rgbw
    id: kitchen_undercabinet_refrigerator
    name: Refrigerator
    restore_mode: RESTORE_DEFAULT_OFF
    red: pwm_red_s1
    green: pwm_green_s1
    blue: pwm_blue_s1
    white: pwm_white_s1
    effects:
      - flicker:
      - pulse:
      - random:
          transition_length: 500ms
          update_interval: 1s
      - strobe:

output:
  # strip 1
  - platform: ledc
    id: pwm_red_s1
    pin: 15
  - platform: ledc
    id: pwm_green_s1
    pin: 17
  - platform: ledc
    id: pwm_blue_s1
    pin: 12
  - platform: ledc
    id: pwm_white_s1
    pin: 14
  # strip 2
  - platform: ledc
    id: pwm_red_s2
    pin: 16
  - platform: ledc
    id: pwm_green_s2
    pin: 18
  - platform: ledc
    id: pwm_blue_s2
    pin: 13
  - platform: ledc
    id: pwm_white_s2
    pin: 27
  # strip 3
  - platform: ledc
    id: pwm_red_s3
    pin: 22
  - platform: ledc
    id: pwm_green_s3
    pin: 23
  - platform: ledc
    id: pwm_blue_s3
    pin: 21
  - platform: ledc
    id: pwm_white_s3
    pin: 19
  # strip 4
  - platform: ledc
    id: pwm_red_s4
    pin: 25
  - platform: ledc
    id: pwm_green_s4
    pin: 26
  - platform: ledc
    id: pwm_blue_s4
    pin: 33
  - platform: ledc
    id: pwm_white_s4
    pin: 32
