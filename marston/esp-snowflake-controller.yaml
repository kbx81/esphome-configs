substitutions:
  node_name: esp-snowflake-controller
  node_friendly_name: Snowflake
  project_name: Snowflake_Controller
  project_version: v1

packages:
  esp_common: !include shared/esp__common_core.yaml

# external_components:
#   - source:
#       # type: git
#       # url: https://github.com/kbx81/esphome_external_components
#       type: local
#       path: ../esphome_external_components/components
#     components:
#       - lr_snowflake
#     refresh: always

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf
    advanced:
      signed_ota_verification:
        signing_key: shared/kbx_signing_key_rsa3072.pem
        signing_scheme: rsa3072

wifi:
  enable_btm: true
  enable_rrm: true

web_server:
  port: 80
  version: 3

logger:

status_led:
  pin:
    number: 5
    inverted: true

power_supply:
  id: snowflake_string_0_power
  keep_on_time: 4s
  pin: 1

remote_receiver:
  id: snow_rmt_rx
  # dump: all
  # filter must be < 12 µs: the HIGH gap on ch1 between Board 1's own 0xB1 BREAK
  # and the first relay bit from Board 2 is ~12 µs. At 50 µs the filter merges
  # them into an ~866 µs unrecognised pulse, dropping Board 1 and Board 2's counts.
  # 5 µs gives 2× margin above relay-chain latency (~300–600 ns) and is well below
  # the 128 µs minimum (BIT_ZERO_MARK_US − tolerance).
  filter: 5us
  idle: 5000us
  pin:
    number: 2
    allow_other_uses: true

remote_transmitter:
  id: snow_rmt_tx
  carrier_duty_percent: 100%
  pin:
    number: 2
    allow_other_uses: true
    mode:
      input: true
      output: true
      open_drain: true
      pullup: true

lr_snowflake:
  id: snowflake_string_0
  power_supply: snowflake_string_0_power
  transmitter_id: snow_rmt_tx
  receiver_id: snow_rmt_rx
  strand_length:
    name: Snowflake Strand Length
  board_ids:
    - snowflake_board_0
    - snowflake_board_1
    - snowflake_board_2

button:
  - platform: template
    id: snowflake_update_firmware_btn
    name: Snowflake Update Firmware
    entity_category: diagnostic
    icon: mdi:update
    on_press:
      - lr_snowflake.upload_firmware:
          url: https://www.kbx81.net/download/public/lr_snowflake/SnowFlakeFirmware.bin

select:
  - platform: lr_snowflake
    id: snowflake_0_scene
    lr_snowflake_id: snowflake_string_0
    type: scene
    name: Snowflake Scene
  - platform: lr_snowflake
    board_id: snowflake_board_0
    lr_snowflake_id: snowflake_string_0
    type: scene
    name: Snowflake 0 Scene
  - platform: lr_snowflake
    board_id: snowflake_board_1
    lr_snowflake_id: snowflake_string_0
    type: scene
    name: Snowflake 1 Scene
  - platform: lr_snowflake
    board_id: snowflake_board_2
    lr_snowflake_id: snowflake_string_0
    type: scene
    name: Snowflake 2 Scene
  - platform: lr_snowflake
    id: snowflake_0_mode
    lr_snowflake_id: snowflake_string_0
    type: mode
    name: Snowflake Mode
  - platform: lr_snowflake
    id: snowflake_0_duration
    lr_snowflake_id: snowflake_string_0
    type: duration
    name: Snowflake Duration

switch:
  - platform: lr_snowflake
    id: snowflake_0_power
    lr_snowflake_id: snowflake_string_0
    name: Snowflake Power
  # - platform: gpio
  #   id: snowflake_string_test_switch
  #   name: Snowflake Test
  #   pin: 22
  #   restore_mode: RESTORE_DEFAULT_OFF
