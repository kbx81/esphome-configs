esphome:
  name: esp-z-wave-proxy-poe
  friendly_name: Z-Wave Proxy
  build_path: ../../build/esp-z-wave-proxy-poe

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      signed_ota_verification:
        signing_key: shared/kbx_signing_key_rsa3072.pem
        signing_scheme: rsa3072

psram:
  mode: octal
  speed: 80MHz

ethernet:
  type: W5500
  mosi_pin: GPIO11
  miso_pin: GPIO12
  clk_pin: GPIO13
  cs_pin: GPIO14
  reset_pin: GPIO9
  interrupt_pin: GPIO10

mdns:
  services:
    - service: "_zwave"
      protocol: "_tcp"
      port: 6053
      txt:
        protocol: "esphome"

api:
  # encryption:
  #   key: !secret encryption_key

logger:
  # Because we take over the USB port for the ZWA-2, send logs to UART0 instead of USB
  hardware_uart: UART0

ota:
  - platform: esphome
    password: !secret ota_password

usb_host:
  devices:
    - id: device_0
      vid: 0x303A
      pid: 0x4001

usb_uart:
  - type: CDC_ACM
    vid: 0x303A
    pid: 0x4001
    channels:
      - id: uch_1
        baud_rate: 115200
        buffer_size: 1024

zwave_proxy:
  id: zw_proxy

bluetooth_proxy:

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

switch:
  - platform: template
    id: bluetooth_enabled_switch
    name: Bluetooth Proxy
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # BT stack must be initialized before we can call enable/disable actions
    setup_priority: 275.0
    turn_on_action:
      - ble.enable:
    turn_off_action:
      - ble.disable:

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    name: Status Light
    pin: GPIO21
    chipset: ws2812
    rgb_order: GRB
    num_leds: 1
    effects:
      - strobe:
      - addressable_rainbow:
